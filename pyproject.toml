[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-insertion-modeling"
version = "0.1.0"
description = "Oxidation-state inference, featurizers and random-forest models for the stability of ion-insertion electrode materials on ion insertion and removal."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charles Schwarz" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# Pinned to the versions behind the paper: ChemEnv environments (and so P1 states and the features) depend on the
# pymatgen version, and saved models on the scikit-learn version.
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "pyarrow==25.0.1",
    "pymatgen==2025.10.7",
    "pymatgen-analysis-defects==2026.3.20",
    "matminer==0.9.3",
    "scikit-learn==1.7.2",
    "joblib==1.6.0",
    "skops==0.15.0",
]

[project.optional-dependencies]
mp = ["mp-api==0.45.13"]
plots = ["matplotlib==3.10.9"]
shap = ["shap==0.49.1"]
dev = ["pytest==9.1.1", "nbmake==1.5.5", "ipykernel==7.3.0", "nbformat==5.10.4", "ruff==0.14.0", "matplotlib==3.10.9"]

[project.urls]
Repository = "https://github.com/CharlesSchwarz/ion_insertion_modeling"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ion_insertion_modeling = ["data/*.json", "data/*.csv", "data/demo/Li/*", "data/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs ChemEnv or a full cross-validation (deselect with -m 'not slow')",
    "release: needs the data release (skipped when it is not available)",
]

[tool.ruff]
line-length = 120
